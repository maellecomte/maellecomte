<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <foreignObject width="900" height="260">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.wrap { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; color: #111; background: #fff;
  border: 1px solid #d0d7de; border-radius: 12px; overflow: hidden; position: relative; }
.muted { color: #59636e; }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
.tag { display: inline-block; font: 500 11.5px ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; color: #59636e; border: 1px solid #d0d7de;
  border-radius: 6px; padding: 3px 7px; margin: 0 4px 4px 0; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #1a7f37; display: inline-block;
  box-shadow: 0 0 0 0 rgba(26,127,55,.5); animation: pulse 2.2s ease-out infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(26,127,55,.45); } 70% { box-shadow: 0 0 0 7px rgba(26,127,55,0); } 100% { box-shadow: 0 0 0 0 rgba(26,127,55,0); } }
@keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.in { animation: up .7s ease-out both; }
@media (prefers-color-scheme: dark) {
  .wrap { background: #0d1117; color: #f0f6fc; border-color: #30363d; }
  .muted { color: #9198a1; }
  .tag { color: #9198a1; border-color: #30363d; }
  .dot { background: #3fb950; }
}

.grid { position: absolute; inset: 0;
  background-image: linear-gradient(#eaeef2 1px, transparent 1px), linear-gradient(90deg, #eaeef2 1px, transparent 1px);
  background-size: 28px 28px; mask-image: radial-gradient(ellipse 70% 90% at 85% 50%, #000 10%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 70% 90% at 85% 50%, #000 10%, transparent 75%); }
.content { position: relative; padding: 44px 52px; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid #d0d7de;
  border-radius: 999px; padding: 5px 12px 5px 10px; }
h1 { font-size: 54px; font-weight: 700; letter-spacing: -1.6px; margin-top: 22px; line-height: 1; }
.role { font-size: 20px; margin-top: 12px; }
.cmd { font-size: 14.5px; margin-top: 26px; }
.cmd b { color: #1a7f37; font-weight: 500; }
.caret { display: inline-block; width: 8px; height: 16px; background: currentColor; vertical-align: -3px;
  margin-left: 3px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.term { position: absolute; right: 52px; top: 50px; width: 300px; border: 1px solid #d0d7de; border-radius: 10px;
  background: #f6f8fa; font: 12.5px/1.75 ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; overflow: hidden; }
.term .bar { padding: 8px 12px; border-bottom: 1px solid #d0d7de; display: flex; gap: 6px; }
.term .bar i { width: 9px; height: 9px; border-radius: 50%; background: #d0d7de; display: block; }
.term .body { padding: 10px 14px 12px; }
.term .k { color: #59636e; }
.term .ok { color: #1a7f37; }
.l1 { animation-delay: .5s; } .l2 { animation-delay: .8s; } .l3 { animation-delay: 1.1s; } .l4 { animation-delay: 1.4s; }
@media (prefers-color-scheme: dark) {
  .grid { background-image: linear-gradient(#161b22 1px, transparent 1px), linear-gradient(90deg, #161b22 1px, transparent 1px); }
  .status, .term, .term .bar { border-color: #30363d; }
  .term { background: #010409; }
  .term .bar i { background: #30363d; }
  .term .k { color: #9198a1; }
  .cmd b, .term .ok { color: #3fb950; }
}
</style>

      <div class="grid"></div>
      <div class="content">
        <div class="status in"><span class="dot"></span>Disponible pour des missions</div>
        <h1 class="in" style="animation-delay:.1s">Maël Lecomte</h1>
        <div class="role muted in" style="animation-delay:.2s">Développeur web &amp; DevOps · Angers</div>
        <div class="cmd mono muted in" style="animation-delay:.3s"><b>$</b> des outils simples, pour des métiers précis<span class="caret"></span></div>
      </div>
      <div class="term">
        <div class="bar"><i></i><i></i><i></i></div>
        <div class="body">
          <div class="in l1"><span class="k">$</span> docker compose ps</div>
          <div class="in l2"><span class="ok">●</span> badgeuse <span class="k">· up</span></div>
          <div class="in l3"><span class="ok">●</span> affichage <span class="k">· up</span></div>
          <div class="in l4"><span class="ok">●</span> informateck <span class="k">· up</span></div>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
