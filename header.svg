<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <style>
    .bg { fill: #ffffff; stroke: #d9d9d9; stroke-width: 1; }
    .name { font: 700 52px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #111111; letter-spacing: -1px; }
    .role { font: 400 20px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b6b6b; }
    .mono { font: 400 15px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #6b6b6b; }
    .rule { stroke: #111111; stroke-width: 2; }
    .cursor { fill: #111111; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .name, .rule, .cursor { fill: #f0f0f0; stroke: #f0f0f0; }
      .name { stroke: none; }
      .role, .mono { fill: #8b949e; }
    }

    .name, .role, .mono { opacity: 0; animation: up .8s ease-out forwards; }
    .role { animation-delay: .25s; }
    .mono { animation-delay: .5s; }
    .rule { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .8s ease-out .15s forwards; }
    .cursor { animation: blink 1.1s steps(1) infinite; }

    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="899" height="219" rx="10"/>
  <line class="rule" x1="56" y1="52" x2="136" y2="52"/>
  <text class="name" x="56" y="116">Maël Lecomte</text>
  <text class="role" x="56" y="152">Développeur web &amp; DevOps · Angers</text>
  <text class="mono" x="56" y="188">$ des outils simples, pour des métiers précis <tspan class="cursor">▍</tspan></text>
</svg>
